services:

  # Redis - 消息代理和结果后端
  bsca-expert-redis:
    image: redis:7-alpine
    container_name: bsca-expert-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - bsca-expert-network

  # PostgreSQL - 主数据库
  bsca-expert-postgres:
    image: postgres:16-alpine
    container_name: bsca-expert-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: open_binary_sca
      POSTGRES_USER: open_binary_sca
      POSTGRES_PASSWORD: open_binary_sca
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U open_binary_sca"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - bsca-expert-network

  # 应用服务 - 同时运行FastAPI和Celery Worker
  bsca-expert-app:
    build:
      context: ..
      dockerfile: compose/Dockerfile
    container_name: bsca-expert-app
    restart: unless-stopped
    environment:
      # 应用配置
      APP_NAME: "BSCA Expert Agent API"
      APP_VERSION: "0.1.0"
      APP_HOST: "0.0.0.0"
      APP_PORT: "8000"
      APP_DEBUG: "true"
      
      # 数据库配置
      POSTGRES_HOST: bsca-expert-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USERNAME: open_binary_sca
      POSTGRES_PASSWORD: open_binary_sca
      POSTGRES_DATABASE_MAIN: open_binary_sca
      POSTGRES_DATABASE_KNOWLEDGE: knowledge
      
      # Redis配置
      REDIS_HOST: bsca-expert-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB_BROKER: 0
      REDIS_DB_RESULT: 0
      REDIS_DB_METADATA: 2
      
      # Python配置
      PYTHONUNBUFFERED: 1
      PYTHONPATH: /code
      
      # CORS配置
      BACKEND_CORS_ORIGINS: "*"
      CORS_ORIGINS: "*"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - app_data:/data  # 应用数据目录
      - /etc/localtime:/etc/localtime:ro  # 时区同步
    depends_on:
      bsca-expert-postgres:
        condition: service_healthy
      bsca-expert-redis:
        condition: service_healthy
    networks:
      - bsca-expert-network
    healthcheck:
      test: ["CMD", "/code/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# Networks
networks:
  bsca-expert-network:
    name: bsca-expert-network
    driver: bridge

# 数据卷定义
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  app_data:
    driver: local

